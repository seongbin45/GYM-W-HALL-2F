# Release Drafter 설정 — PR 이 머지될 때마다 다음 릴리스 변경로그 초안을 누적합니다.
# 라벨로 분류하고, 라벨로 다음 버전(semver)을 정합니다. 라벨이 없으면 patch.
name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

categories:
  - title: '✨ 기능'
    labels: ['feature', 'enhancement', '기능']
  - title: '🐛 수정'
    labels: ['fix', 'bug', '수정']
  - title: '🧹 정리·리팩터'
    labels: ['chore', 'refactor', '정리']
  - title: '📝 문서'
    labels: ['docs', '문서']

change-template: '- $TITLE (#$NUMBER)'
change-title-escapes: '\<*_&'

version-resolver:
  major:
    labels: ['major', 'breaking']
  minor:
    labels: ['minor', 'feature', 'enhancement', '기능']
  patch:
    labels: ['patch', 'fix', 'bug', '수정', 'chore', 'refactor', '정리', 'docs', '문서']
  default: patch

exclude-labels:
  - 'skip-changelog'

template: |
  ## 변경 사항

  $CHANGES

  **전체 비교**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION
